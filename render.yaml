services:
  - type: web
    name: carloacutisweb-back
    runtime: node
    rootDir: carlo-back
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: carloacutisweb-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://carloacutisweb-front.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: web
    name: carloacutisweb-front
    runtime: node
    rootDir: carlo-front
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://carloacutisweb-back.onrender.com
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://carloacutisweb-back.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://carloacutisweb-front.onrender.com

databases:
  - name: carloacutisweb-db
    plan: free
    databaseName: carloacutisweb
    user: carloacutisweb
